<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Transcript to hook study workflow</title>
  <desc id="desc">Four cards show transcript segments becoming hook notes, evidence notes, and an original content brief.</desc>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f8f1"/>
      <stop offset="1" stop-color="#e8f0e6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#20332a" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="760" height="360" rx="24" fill="url(#wash)"/>
  <path d="M28 292 C160 250 200 318 330 276 S530 242 732 286" fill="none" stroke="#d7e3d6" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#20332a">
    <text x="42" y="44" font-size="11" letter-spacing="2.4" fill="#64716a" font-weight="700">A REPEATABLE REVIEW LOOP</text>
    <text x="42" y="72" font-size="22" font-weight="600">Turn words into structure, then write your own.</text>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="34" y="122" width="154" height="122" rx="16" fill="#fff" stroke="#dce7d9"/>
    <rect x="213" y="122" width="154" height="122" rx="16" fill="#fff" stroke="#dce7d9"/>
    <rect x="392" y="122" width="154" height="122" rx="16" fill="#fff" stroke="#dce7d9"/>
    <rect x="571" y="122" width="154" height="122" rx="16" fill="#2a5844"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g fill="#64806e" font-size="10" font-weight="700" letter-spacing="1.5">
      <text x="52" y="149">01 · READ</text><text x="231" y="149">02 · LABEL</text><text x="410" y="149">03 · TEST</text>
    </g>
    <g fill="#20332a" font-size="17" font-weight="600">
      <text x="52" y="178">Transcript</text><text x="231" y="178">Hook notes</text><text x="410" y="178">Evidence</text>
    </g>
    <g fill="#64716a" font-size="11">
      <text x="52" y="202">words + cue times</text><text x="231" y="202">promise · tension</text><text x="410" y="202">proof · payoff</text>
      <text x="52" y="222">keep the source</text><text x="231" y="222">structure, not lines</text><text x="410" y="222">listen and compare</text>
    </g>
    <g fill="#d8eadc" font-size="10" font-weight="700" letter-spacing="1.5"><text x="589" y="149">04 · WRITE</text></g>
    <text x="589" y="178" fill="#fff" font-size="17" font-weight="600">New brief</text>
    <text x="589" y="202" fill="#d8eadc" font-size="11">your audience + proof</text>
    <text x="589" y="222" fill="#d8eadc" font-size="11">your words + next step</text>
  </g>
  <g fill="none" stroke="#7b9e83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 183h18"/><path d="M369 183h18"/><path d="M548 183h18"/>
    <path d="m202 177 7 6-7 6"/><path d="m381 177 7 6-7 6"/><path d="m560 177 7 6-7 6"/>
  </g>
  <text x="42" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64716a">A transcript can reveal a pattern without becoming copy.</text>
</svg>
