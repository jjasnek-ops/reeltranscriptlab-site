<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">Empty transcript check on mobile</title>
  <desc id="desc">A mobile four-step check: play the public Reel, listen for speech, read the exact response, and retry once when appropriate.</desc>
  <defs>
    <linearGradient id="bgm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10172f"/>
      <stop offset="1" stop-color="#1c2c58"/>
    </linearGradient>
    <linearGradient id="accentm" x1="0" x2="1">
      <stop offset="0" stop-color="#79f2c0"/>
      <stop offset="1" stop-color="#65b7ff"/>
    </linearGradient>
    <filter id="shadowm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#050817" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="600" height="500" rx="26" fill="url(#bgm)"/>
  <path d="M0 430c132-51 220 18 330-20 97-33 166-50 270-72v162H0Z" fill="#0a1028" opacity=".55"/>
  <text x="34" y="46" fill="#9cb5df" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">EMPTY RESULT</text>
  <text x="34" y="78" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">No speech returned</text>
  <text x="34" y="105" fill="#9cb5df" font-family="Arial, sans-serif" font-size="15">does not prove no audio.</text>

  <g filter="url(#shadowm)">
    <rect x="34" y="130" width="532" height="70" rx="16" fill="#fff"/>
    <rect x="34" y="218" width="532" height="70" rx="16" fill="#fff"/>
    <rect x="34" y="306" width="532" height="70" rx="16" fill="#fff"/>
    <rect x="34" y="394" width="532" height="70" rx="16" fill="#fff"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="75" cy="165" r="18" fill="url(#accentm)"/><text x="75" y="171" text-anchor="middle" fill="#07132c" font-size="15" font-weight="700">1</text>
    <text x="108" y="160" fill="#10172f" font-size="17" font-weight="700">Play the public URL</text>
    <text x="108" y="181" fill="#53617d" font-size="13">Use the Reel you actually submitted.</text>

    <circle cx="75" cy="253" r="18" fill="url(#accentm)"/><text x="75" y="259" text-anchor="middle" fill="#07132c" font-size="15" font-weight="700">2</text>
    <text x="108" y="248" fill="#10172f" font-size="17" font-weight="700">Listen once</text>
    <text x="108" y="269" fill="#53617d" font-size="13">Speech, music, silence, or unclear?</text>

    <circle cx="75" cy="341" r="18" fill="url(#accentm)"/><text x="75" y="347" text-anchor="middle" fill="#07132c" font-size="15" font-weight="700">3</text>
    <text x="108" y="336" fill="#10172f" font-size="17" font-weight="700">Read the exact branch</text>
    <text x="108" y="357" fill="#53617d" font-size="13">Empty, inaccessible, queued, or timed out?</text>

    <circle cx="75" cy="429" r="18" fill="url(#accentm)"/><text x="75" y="435" text-anchor="middle" fill="#07132c" font-size="15" font-weight="700">4</text>
    <text x="108" y="424" fill="#10172f" font-size="17" font-weight="700">Retry once when told to wait</text>
    <text x="108" y="445" fill="#53617d" font-size="13">Save the URL and message first.</text>
  </g>
</svg>

