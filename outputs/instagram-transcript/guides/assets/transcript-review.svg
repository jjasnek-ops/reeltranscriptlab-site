<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Review a transcript before reuse</title>
  <desc id="desc">A four-step path compares transcript text and subtitle timing against the source video before correction.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4e5"/><stop offset="1" stop-color="#f0edf7"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbfcf8"/></linearGradient>
  </defs>
  <rect width="760" height="300" rx="24" fill="url(#wash)"/>
  <text x="34" y="46" fill="#526b54" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">A REVIEW YOU CAN REPEAT</text>
  <path d="M112 145H650" stroke="#b9c8ad" stroke-width="3" stroke-dasharray="5 8"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(32 82)">
      <rect width="156" height="128" rx="17" fill="url(#card)" stroke="#dce5d8"/>
      <circle cx="25" cy="25" r="14" fill="#e9f0df"/><text x="25" y="29" text-anchor="middle" fill="#34553a" font-size="11" font-weight="700">01</text>
      <path d="M53 24h76M53 34h60M53 44h70" stroke="#698365" stroke-width="3" stroke-linecap="round"/>
      <text x="18" y="82" fill="#20352b" font-size="14" font-weight="700">Read the words</text>
      <text x="18" y="103" fill="#65746a" font-size="11">Names · numbers · short words</text>
    </g>
    <g transform="translate(222 82)">
      <rect width="156" height="128" rx="17" fill="url(#card)" stroke="#dce5d8"/>
      <circle cx="25" cy="25" r="14" fill="#e9f0df"/><text x="25" y="29" text-anchor="middle" fill="#34553a" font-size="11" font-weight="700">02</text>
      <path d="M53 32c7-18 14 18 22 0s15 18 23 0 15 18 24 0" fill="none" stroke="#698365" stroke-width="3" stroke-linecap="round"/>
      <text x="18" y="82" fill="#20352b" font-size="14" font-weight="700">Play the source</text>
      <text x="18" y="103" fill="#65746a" font-size="11">Compare the exact phrase</text>
    </g>
    <g transform="translate(412 82)">
      <rect width="156" height="128" rx="17" fill="url(#card)" stroke="#dce5d8"/>
      <circle cx="25" cy="25" r="14" fill="#e9f0df"/><text x="25" y="29" text-anchor="middle" fill="#34553a" font-size="11" font-weight="700">03</text>
      <path d="M54 23h78M54 34h65M54 45h70" stroke="#8a79a7" stroke-width="3" stroke-linecap="round"/><text x="54" y="58" fill="#756487" font-size="8">START → END</text>
      <text x="18" y="82" fill="#20352b" font-size="14" font-weight="700">Check cue timing</text>
      <text x="18" y="103" fill="#65746a" font-size="11">Use SRT or VTT in an editor</text>
    </g>
    <g transform="translate(602 82)">
      <rect width="126" height="128" rx="17" fill="#244c38"/>
      <circle cx="25" cy="25" r="14" fill="#dce8ce"/><text x="25" y="29" text-anchor="middle" fill="#244c38" font-size="11" font-weight="700">04</text>
      <path d="m53 33 8 8 16-18" fill="none" stroke="#adc99c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="82" fill="#fff" font-size="14" font-weight="700">Correct it</text>
      <text x="18" y="103" fill="#d5e1d3" font-size="10">Save a checked copy</text>
    </g>
  </g>
  <text x="34" y="260" fill="#526b54" font-family="Arial,sans-serif" font-size="11">A generated transcript is a starting point, not a timing certificate.</text>
</svg>
