<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Four steps for finding quote boundaries</title>
  <desc id="desc">Read transcript text, mark subtitle cues, check the source audio, and cut the original video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#e5f6f2"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#7157ff"/>
      <stop offset="1" stop-color="#20a48b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#25334a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="760" height="360" rx="28" fill="url(#bg)"/>
  <path d="M96 190H664" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(38 74)">
      <rect width="150" height="190" rx="20" fill="#fff"/>
      <circle cx="34" cy="38" r="20" fill="#7157ff"/><text x="34" y="45" fill="#fff" font-size="18" text-anchor="middle" font-weight="700">1</text>
      <text x="22" y="88" fill="#1d2b42" font-size="18" font-weight="700">Read</text>
      <text x="22" y="118" fill="#52627a" font-size="14">Find the</text>
      <text x="22" y="139" fill="#52627a" font-size="14">spoken idea</text>
      <path d="M22 163h100M22 174h82" stroke="#b9c4d8" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(218 74)">
      <rect width="150" height="190" rx="20" fill="#fff"/>
      <circle cx="34" cy="38" r="20" fill="#7d64ff"/><text x="34" y="45" fill="#fff" font-size="18" text-anchor="middle" font-weight="700">2</text>
      <text x="22" y="88" fill="#1d2b42" font-size="18" font-weight="700">Mark</text>
      <text x="22" y="118" fill="#52627a" font-size="14">Note first</text>
      <text x="22" y="139" fill="#52627a" font-size="14">and last cue</text>
      <path d="M22 166h106" stroke="#7157ff" stroke-width="9" stroke-linecap="round"/><circle cx="43" cy="166" r="8" fill="#fff"/><circle cx="109" cy="166" r="8" fill="#fff"/>
    </g>
    <g transform="translate(398 74)">
      <rect width="150" height="190" rx="20" fill="#fff"/>
      <circle cx="34" cy="38" r="20" fill="#318f9f"/><text x="34" y="45" fill="#fff" font-size="18" text-anchor="middle" font-weight="700">3</text>
      <text x="22" y="88" fill="#1d2b42" font-size="18" font-weight="700">Check</text>
      <text x="22" y="118" fill="#52627a" font-size="14">Listen through</text>
      <text x="22" y="139" fill="#52627a" font-size="14">both boundaries</text>
      <path d="M28 168q10-18 20 0t20 0t20 0t20 0" fill="none" stroke="#20a48b" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(578 74)">
      <rect width="150" height="190" rx="20" fill="#fff"/>
      <circle cx="34" cy="38" r="20" fill="#20a48b"/><text x="34" y="45" fill="#fff" font-size="18" text-anchor="middle" font-weight="700">4</text>
      <text x="22" y="88" fill="#1d2b42" font-size="18" font-weight="700">Cut</text>
      <text x="22" y="118" fill="#52627a" font-size="14">Edit the</text>
      <text x="22" y="139" fill="#52627a" font-size="14">source video</text>
      <path d="M25 169h45l-12-12M70 169h45l-12 12" fill="none" stroke="#20a48b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="380" y="330" fill="#52627a" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Text finds the passage · cue times find the review range · your editor makes the clip</text>
</svg>
