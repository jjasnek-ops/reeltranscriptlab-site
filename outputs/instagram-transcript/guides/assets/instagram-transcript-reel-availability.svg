<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Instagram Reel transcript availability checks</title>
  <desc id="desc">Four connected cards show URL, retrieval, speech, and result checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10172a"/><stop offset="1" stop-color="#1b2745"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#71e0c0"/><stop offset="1" stop-color="#8ba7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050914" flood-opacity=".28"/></filter>
  </defs>
  <rect width="900" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="758" cy="56" r="90" fill="#71e0c0" opacity=".08"/>
  <circle cx="112" cy="322" r="120" fill="#8ba7ff" opacity=".08"/>
  <text x="48" y="50" fill="#dfe9ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ONE REEL · FOUR GATES</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(42 90)">
      <rect width="178" height="176" rx="20" fill="#202d4d" stroke="#3b4c73"/>
      <circle cx="30" cy="34" r="18" fill="#71e0c0"/><text x="30" y="40" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">1</text>
      <text x="22" y="82" fill="#ffffff" font-size="19" font-weight="800">URL</text>
      <text x="22" y="109" fill="#b8c8e8" font-size="14">supported public</text>
      <text x="22" y="130" fill="#b8c8e8" font-size="14">shape?</text>
      <rect x="22" y="148" width="112" height="4" rx="2" fill="url(#accent)"/>
    </g>
    <path d="M232 178h38" stroke="#71e0c0" stroke-width="4" stroke-linecap="round"/><path d="m264 166 14 12-14 12" fill="none" stroke="#71e0c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(268 90)">
      <rect width="178" height="176" rx="20" fill="#202d4d" stroke="#3b4c73"/>
      <circle cx="30" cy="34" r="18" fill="#8ba7ff"/><text x="30" y="40" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">2</text>
      <text x="22" y="82" fill="#ffffff" font-size="19" font-weight="800">FETCH</text>
      <text x="22" y="109" fill="#b8c8e8" font-size="14">public and</text>
      <text x="22" y="130" fill="#b8c8e8" font-size="14">reachable?</text>
      <rect x="22" y="148" width="112" height="4" rx="2" fill="url(#accent)"/>
    </g>
    <path d="M458 178h38" stroke="#71e0c0" stroke-width="4" stroke-linecap="round"/><path d="m490 166 14 12-14 12" fill="none" stroke="#71e0c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(494 90)">
      <rect width="178" height="176" rx="20" fill="#202d4d" stroke="#3b4c73"/>
      <circle cx="30" cy="34" r="18" fill="#f4c978"/><text x="30" y="40" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">3</text>
      <text x="22" y="82" fill="#ffffff" font-size="19" font-weight="800">SPEECH</text>
      <text x="22" y="109" fill="#b8c8e8" font-size="14">words in</text>
      <text x="22" y="130" fill="#b8c8e8" font-size="14">returned segments?</text>
      <rect x="22" y="148" width="112" height="4" rx="2" fill="url(#accent)"/>
    </g>
    <path d="M684 178h38" stroke="#71e0c0" stroke-width="4" stroke-linecap="round"/><path d="m716 166 14 12-14 12" fill="none" stroke="#71e0c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(720 90)">
      <rect width="138" height="176" rx="20" fill="#243756" stroke="#3b4c73"/>
      <circle cx="30" cy="34" r="18" fill="#ff8aa1"/><text x="30" y="40" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">4</text>
      <text x="22" y="82" fill="#ffffff" font-size="19" font-weight="800">RESULT</text>
      <text x="22" y="109" fill="#b8c8e8" font-size="14">read the</text>
      <text x="22" y="130" fill="#b8c8e8" font-size="14">exact message</text>
      <rect x="22" y="148" width="88" height="4" rx="2" fill="url(#accent)"/>
    </g>
  </g>
  <text x="48" y="316" fill="#9eb0d3" font-family="Inter,Arial,sans-serif" font-size="15">A valid link is the first check, not the whole transcript guarantee.</text>
</svg>

