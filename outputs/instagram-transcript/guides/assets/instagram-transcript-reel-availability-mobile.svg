<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
  <title id="title">Instagram Reel transcript availability checks on mobile</title>
  <desc id="desc">A vertical mobile diagram shows URL, retrieval, speech, and result checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10172a"/><stop offset="1" stop-color="#1b2745"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#71e0c0"/><stop offset="1" stop-color="#8ba7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050914" flood-opacity=".28"/></filter>
  </defs>
  <rect width="700" height="560" rx="28" fill="url(#bg)"/>
  <text x="38" y="48" fill="#dfe9ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ONE REEL · FOUR GATES</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(38 76)"><rect width="280" height="170" rx="20" fill="#202d4d" stroke="#3b4c73"/><circle cx="34" cy="36" r="18" fill="#71e0c0"/><text x="34" y="42" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">1</text><text x="28" y="82" fill="#fff" font-size="20" font-weight="800">URL</text><text x="28" y="111" fill="#b8c8e8" font-size="15">supported public shape?</text><rect x="28" y="142" width="170" height="4" rx="2" fill="url(#accent)"/></g>
    <g transform="translate(382 76)"><rect width="280" height="170" rx="20" fill="#202d4d" stroke="#3b4c73"/><circle cx="34" cy="36" r="18" fill="#8ba7ff"/><text x="34" y="42" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">2</text><text x="28" y="82" fill="#fff" font-size="20" font-weight="800">FETCH</text><text x="28" y="111" fill="#b8c8e8" font-size="15">public and reachable?</text><rect x="28" y="142" width="170" height="4" rx="2" fill="url(#accent)"/></g>
    <g transform="translate(38 288)"><rect width="280" height="170" rx="20" fill="#202d4d" stroke="#3b4c73"/><circle cx="34" cy="36" r="18" fill="#f4c978"/><text x="34" y="42" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">3</text><text x="28" y="82" fill="#fff" font-size="20" font-weight="800">SPEECH</text><text x="28" y="111" fill="#b8c8e8" font-size="15">words in segments?</text><rect x="28" y="142" width="170" height="4" rx="2" fill="url(#accent)"/></g>
    <g transform="translate(382 288)"><rect width="280" height="170" rx="20" fill="#243756" stroke="#3b4c73"/><circle cx="34" cy="36" r="18" fill="#ff8aa1"/><text x="34" y="42" text-anchor="middle" fill="#102039" font-size="16" font-weight="800">4</text><text x="28" y="82" fill="#fff" font-size="20" font-weight="800">RESULT</text><text x="28" y="111" fill="#b8c8e8" font-size="15">read the exact message</text><rect x="28" y="142" width="170" height="4" rx="2" fill="url(#accent)"/></g>
  </g>
  <text x="38" y="520" fill="#9eb0d3" font-family="Inter,Arial,sans-serif" font-size="15">A valid link is only the first check.</text>
</svg>

