<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
  <title id="title">Garbled transcript review on mobile</title>
  <desc id="desc">A mobile four-step review: mark the line, listen again, check timing, and verify language before retrying once.</desc>
  <defs>
    <linearGradient id="bgm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11162e"/>
      <stop offset="1" stop-color="#26345f"/>
    </linearGradient>
    <linearGradient id="accentm" x1="0" x2="1">
      <stop offset="0" stop-color="#ffcf70"/>
      <stop offset="1" stop-color="#ff8ca8"/>
    </linearGradient>
    <filter id="shadowm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#050817" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="600" height="500" rx="26" fill="url(#bgm)"/>
  <path d="M0 433c119-47 216 23 335-20 105-38 164-43 265-67v154H0Z" fill="#090e26" opacity=".58"/>
  <text x="34" y="46" fill="#b5c3e4" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">TRANSCRIPT REVIEW</text>
  <text x="34" y="78" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Words need a listen-through</text>
  <text x="34" y="105" fill="#b5c3e4" font-family="Arial, sans-serif" font-size="15">Formatting is not verification.</text>

  <g filter="url(#shadowm)">
    <rect x="34" y="130" width="532" height="70" rx="16" fill="#fff"/>
    <rect x="34" y="218" width="532" height="70" rx="16" fill="#fff"/>
    <rect x="34" y="306" width="532" height="70" rx="16" fill="#fff"/>
    <rect x="34" y="394" width="532" height="70" rx="16" fill="#fff"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="75" cy="165" r="18" fill="url(#accentm)"/><text x="75" y="171" text-anchor="middle" fill="#24142a" font-size="15" font-weight="700">1</text>
    <text x="108" y="160" fill="#11162e" font-size="17" font-weight="700">Mark the smallest phrase</text>
    <text x="108" y="181" fill="#596581" font-size="13">Keep the suspicious line and time.</text>

    <circle cx="75" cy="253" r="18" fill="url(#accentm)"/><text x="75" y="259" text-anchor="middle" fill="#24142a" font-size="15" font-weight="700">2</text>
    <text x="108" y="248" fill="#11162e" font-size="17" font-weight="700">Listen to the source</text>
    <text x="108" y="269" fill="#596581" font-size="13">Names, numbers, music, overlap.</text>

    <circle cx="75" cy="341" r="18" fill="url(#accentm)"/><text x="75" y="347" text-anchor="middle" fill="#24142a" font-size="15" font-weight="700">3</text>
    <text x="108" y="336" fill="#11162e" font-size="17" font-weight="700">Check the cue</text>
    <text x="108" y="357" fill="#596581" font-size="13">Correct timing separately from text.</text>

    <circle cx="75" cy="429" r="18" fill="url(#accentm)"/><text x="75" y="435" text-anchor="middle" fill="#24142a" font-size="15" font-weight="700">4</text>
    <text x="108" y="424" fill="#11162e" font-size="17" font-weight="700">Verify, then retry once</text>
    <text x="108" y="445" fill="#596581" font-size="13">Check language and Reel version.</text>
  </g>
</svg>

