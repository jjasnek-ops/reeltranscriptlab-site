<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Transcript request status path</title>
  <desc id="desc">The request moves from queued to processing to a completed result. Text is ready to review; an empty result needs an audio check. A timeout calls for a pause before retrying.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9f2"/><stop offset="1" stop-color="#f0edf9"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9c884"/><stop offset="1" stop-color="#d9c3ed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2b3c32" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#718579"/></marker>
  </defs>
  <rect width="900" height="360" rx="22" fill="url(#bg)"/>
  <text x="34" y="42" fill="#64746a" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">READ THE STATE · CHOOSE THE NEXT STEP</text>
  <g filter="url(#shadow)">
    <rect x="32" y="77" width="178" height="120" rx="17" fill="#fff"/>
    <rect x="244" y="77" width="178" height="120" rx="17" fill="#fff"/>
    <rect x="456" y="77" width="178" height="120" rx="17" fill="#fff"/>
    <rect x="668" y="77" width="200" height="120" rx="17" fill="#fff"/>
  </g>
  <path d="M211 137H235M423 137H447M635 137H659" stroke="#718579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="94" width="30" height="30" rx="9" fill="#edf3e5"/><text x="58" y="114" fill="#315540" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">1</text>
  <text x="48" y="149" fill="#20332a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">Queued</text>
  <text x="48" y="171" fill="#64716a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Wait for the next update</text>
  <rect x="260" y="94" width="30" height="30" rx="9" fill="#f6f0df"/><text x="270" y="114" fill="#805e26" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">2</text>
  <text x="260" y="149" fill="#20332a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">Processing</text>
  <text x="260" y="171" fill="#64716a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Timer reports elapsed time</text>
  <rect x="472" y="94" width="30" height="30" rx="9" fill="#edf3e5"/><text x="482" y="114" fill="#315540" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">3</text>
  <text x="472" y="149" fill="#20332a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">Completed</text>
  <text x="472" y="171" fill="#64716a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Inspect the returned text</text>
  <rect x="684" y="94" width="30" height="30" rx="9" fill="url(#accent)"/><text x="694" y="114" fill="#344535" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">4</text>
  <text x="684" y="149" fill="#20332a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Text or no speech?</text>
  <text x="684" y="171" fill="#64716a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Review audio if the result is empty</text>
  <rect x="32" y="224" width="836" height="94" rx="15" fill="#20332a"/>
  <circle cx="59" cy="270" r="13" fill="#d9c3ed"/><path d="M59 262v9l6 4" fill="none" stroke="#20332a" stroke-width="2" stroke-linecap="round"/>
  <text x="86" y="262" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Timeout? Pause before retrying.</text>
  <text x="86" y="286" fill="#d7dfd8" font-family="Segoe UI,Arial,sans-serif" font-size="12">A timeout does not confirm that the provider stopped the first request.</text>
  <text x="34" y="341" fill="#6b796f" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.2">STATUS ≠ ETA</text>
</svg>
