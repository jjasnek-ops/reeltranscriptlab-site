<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-labelledby="title desc">
  <title id="title">Choose the words you need</title>
  <desc id="desc">Four stacked cards distinguish post copy, a readable transcript, timed subtitle files, and captions rendered over a video.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f5e9"/><stop offset="1" stop-color="#e9e8f2"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbfcf8"/></linearGradient>
    <filter id="shadow" x="-.15" y="-.2" width="1.3" height="1.5"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#213728" flood-opacity=".10"/></filter>
  </defs>
  <rect width="420" height="620" rx="20" fill="url(#bg)"/>
  <text x="22" y="38" fill="#55705a" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">ONE REEL · FOUR DIFFERENT OUTPUTS</text>
  <g filter="url(#shadow)">
    <rect x="18" y="60" width="384" height="118" rx="15" fill="url(#card)"/>
    <rect x="18" y="194" width="384" height="118" rx="15" fill="url(#card)"/>
    <rect x="18" y="328" width="384" height="118" rx="15" fill="url(#card)"/>
    <rect x="18" y="462" width="384" height="138" rx="15" fill="url(#card)" stroke="#cdd9c7"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="48" cy="94" r="14" fill="#e8efe0"/><text x="48" y="99" text-anchor="middle" fill="#294a36" font-size="13" font-weight="700">1</text>
    <text x="76" y="96" fill="#20382b" font-size="15" font-weight="700">POST COPY</text><text x="76" y="123" fill="#607166" font-size="12">Words below the Reel · write separately</text><text x="76" y="148" fill="#738078" font-size="11">Context · hook · call to action</text>

    <circle cx="48" cy="228" r="14" fill="#e8efe0"/><text x="48" y="233" text-anchor="middle" fill="#294a36" font-size="13" font-weight="700">2</text>
    <text x="76" y="230" fill="#20382b" font-size="15" font-weight="700">TRANSCRIPT</text><text x="76" y="257" fill="#607166" font-size="12">Words you can read · copy or TXT</text><text x="76" y="282" fill="#738078" font-size="11">TXT has no cue times</text>

    <circle cx="48" cy="362" r="14" fill="#e8efe0"/><text x="48" y="367" text-anchor="middle" fill="#294a36" font-size="13" font-weight="700">3</text>
    <text x="76" y="364" fill="#20382b" font-size="15" font-weight="700">SUBTITLE FILE</text><text x="76" y="391" fill="#607166" font-size="12">Timed spoken lines · SRT or VTT</text><text x="76" y="416" fill="#738078" font-size="11">Import into an editor</text>

    <circle cx="48" cy="496" r="14" fill="#e8efe0"/><text x="48" y="501" text-anchor="middle" fill="#294a36" font-size="13" font-weight="700">4</text>
    <text x="76" y="498" fill="#20382b" font-size="15" font-weight="700">VIDEO CAPTIONS</text><text x="76" y="525" fill="#607166" font-size="12">Words visibly placed over the image</text><text x="76" y="550" fill="#738078" font-size="11">Edit · preview · export a new video</text>
  </g>
</svg>
