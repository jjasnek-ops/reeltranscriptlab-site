<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Transcript, translation, and visual text are separate checks</title>
  <desc id="desc">A diagram shows speech moving to transcript and subtitle files, while translation and on-screen text follow separate paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#11182c"/><stop offset="1" stop-color="#1e2b4b"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#75e1c1"/><stop offset="1" stop-color="#8aa7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050914" flood-opacity=".28"/></filter>
  </defs>
  <rect width="900" height="360" rx="28" fill="url(#bg)"/>
  <text x="48" y="48" fill="#dfe9ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ONE SOURCE · THREE CHECKS</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(42 100)">
      <rect width="170" height="138" rx="20" fill="#243756" stroke="#3b4c73"/>
      <text x="22" y="43" fill="#fff" font-size="20" font-weight="800">SPEECH</text>
      <text x="22" y="72" fill="#b8c8e8" font-size="14">audio words</text>
      <text x="22" y="95" fill="#b8c8e8" font-size="14">and pauses</text>
      <rect x="22" y="114" width="108" height="4" rx="2" fill="url(#mint)"/>
    </g>
    <path d="M222 169h36" stroke="#75e1c1" stroke-width="4" stroke-linecap="round"/><path d="m252 157 14 12-14 12" fill="none" stroke="#75e1c1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(266 100)">
      <rect width="206" height="138" rx="20" fill="#202d4d" stroke="#3b4c73"/>
      <text x="22" y="43" fill="#fff" font-size="20" font-weight="800">TRANSCRIPT</text>
      <text x="22" y="72" fill="#b8c8e8" font-size="14">TXT · SRT · VTT</text>
      <text x="22" y="95" fill="#b8c8e8" font-size="14">same words, timing kept</text>
      <rect x="22" y="114" width="140" height="4" rx="2" fill="url(#mint)"/>
    </g>
    <path d="M480 154c48-38 70-38 110-28" fill="none" stroke="#f3c77a" stroke-width="3" stroke-dasharray="8 8"/><path d="m582 116 12 12-16 7" fill="none" stroke="#f3c77a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M480 208c48 38 70 38 110 28" fill="none" stroke="#ff8da5" stroke-width="3" stroke-dasharray="8 8"/><path d="m582 244 16-7-12-12" fill="none" stroke="#ff8da5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(610 74)">
      <rect width="238" height="82" rx="18" fill="#3a3240" stroke="#6c5364"/>
      <text x="20" y="34" fill="#fff" font-size="18" font-weight="800">TRANSLATION</text>
      <text x="20" y="59" fill="#d7bdd0" font-size="14">separate language step</text>
    </g>
    <g transform="translate(610 198)">
      <rect width="238" height="82" rx="18" fill="#30334b" stroke="#596184"/>
      <text x="20" y="34" fill="#fff" font-size="18" font-weight="800">ON-SCREEN TEXT</text>
      <text x="20" y="59" fill="#c4c8e5" font-size="14">frame review or OCR</text>
    </g>
  </g>
  <text x="48" y="314" fill="#9eb0d3" font-family="Inter,Arial,sans-serif" font-size="15">A subtitle export is not a translation or a rendered video.</text>
</svg>

