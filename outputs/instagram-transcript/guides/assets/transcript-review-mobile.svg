<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
  <title id="title">Review a transcript on a phone</title>
  <desc id="desc">Four readable steps: read the words, play the source, check subtitle cue timing, then correct and replay.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef4e5"/><stop offset="1" stop-color="#f0edf7"/></linearGradient>
  </defs>
  <rect width="360" height="500" rx="24" fill="url(#wash)"/>
  <text x="22" y="38" fill="#526b54" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">A REVIEW YOU CAN REPEAT</text>
  <path d="M48 91v292" stroke="#b9c8ad" stroke-width="3" stroke-dasharray="5 8"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(20 58)">
      <rect width="320" height="88" rx="16" fill="#fff" stroke="#dce5d8"/>
      <circle cx="28" cy="28" r="16" fill="#e9f0df"/><text x="28" y="32" text-anchor="middle" fill="#34553a" font-size="11" font-weight="700">01</text>
      <path d="M65 20h80M65 31h67M65 42h76" stroke="#698365" stroke-width="3" stroke-linecap="round"/>
      <text x="65" y="66" fill="#20352b" font-size="14" font-weight="700">Read the words</text>
      <text x="180" y="66" fill="#65746a" font-size="11">Names · numbers · short words</text>
    </g>
    <g transform="translate(20 163)">
      <rect width="320" height="88" rx="16" fill="#fff" stroke="#dce5d8"/>
      <circle cx="28" cy="28" r="16" fill="#e9f0df"/><text x="28" y="32" text-anchor="middle" fill="#34553a" font-size="11" font-weight="700">02</text>
      <path d="M65 29c8-18 17 18 25 0s17 18 26 0 16 18 27 0" fill="none" stroke="#698365" stroke-width="3" stroke-linecap="round"/>
      <text x="65" y="66" fill="#20352b" font-size="14" font-weight="700">Play the source</text>
      <text x="180" y="66" fill="#65746a" font-size="11">Compare the exact phrase</text>
    </g>
    <g transform="translate(20 268)">
      <rect width="320" height="88" rx="16" fill="#fff" stroke="#dce5d8"/>
      <circle cx="28" cy="28" r="16" fill="#e9f0df"/><text x="28" y="32" text-anchor="middle" fill="#34553a" font-size="11" font-weight="700">03</text>
      <path d="M65 20h100M65 31h80M65 42h90" stroke="#8a79a7" stroke-width="3" stroke-linecap="round"/>
      <text x="65" y="66" fill="#20352b" font-size="14" font-weight="700">Check cue timing</text>
      <text x="200" y="66" fill="#65746a" font-size="11">Use SRT or VTT in an editor</text>
    </g>
    <g transform="translate(20 373)">
      <rect width="320" height="88" rx="16" fill="#244c38"/>
      <circle cx="28" cy="28" r="16" fill="#dce8ce"/><text x="28" y="32" text-anchor="middle" fill="#244c38" font-size="11" font-weight="700">04</text>
      <path d="m65 31 8 8 16-18" fill="none" stroke="#adc99c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="38" fill="#fff" font-size="14" font-weight="700">Correct and replay</text>
      <text x="105" y="59" fill="#d5e1d3" font-size="11">Save a checked copy</text>
    </g>
  </g>
</svg>
