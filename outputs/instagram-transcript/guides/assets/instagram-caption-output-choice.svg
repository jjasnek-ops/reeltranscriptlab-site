<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Choose the words you need</title>
  <desc id="desc">Four cards distinguish post copy, a readable transcript, timed subtitle files, and captions rendered over a video.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f5e9"/><stop offset="1" stop-color="#e9e8f2"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbfcf8"/></linearGradient>
    <filter id="shadow" x="-.15" y="-.2" width="1.3" height="1.5"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#213728" flood-opacity=".10"/></filter>
  </defs>
  <rect width="900" height="360" rx="22" fill="url(#bg)"/>
  <text x="38" y="49" fill="#55705a" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ONE REEL · FOUR DIFFERENT OUTPUTS</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="32" y="74" width="198" height="224" rx="17" fill="url(#card)"/>
    <rect x="251" y="74" width="198" height="224" rx="17" fill="url(#card)"/>
    <rect x="470" y="74" width="198" height="224" rx="17" fill="url(#card)"/>
    <rect x="689" y="74" width="179" height="224" rx="17" fill="url(#card)" stroke="#cdd9c7"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="62" cy="112" r="15" fill="#e8efe0"/><text x="62" y="117" text-anchor="middle" fill="#294a36" font-size="14" font-weight="700">1</text>
    <text x="52" y="154" fill="#20382b" font-size="17" font-weight="700">POST COPY</text>
    <text x="52" y="183" fill="#607166" font-size="13">Words below the Reel</text>
    <path d="M52 204h145" stroke="#e0e7dc"/>
    <text x="52" y="236" fill="#42664b" font-size="12" font-weight="700">Write separately</text>
    <text x="52" y="260" fill="#738078" font-size="11">Context · hook · CTA</text>

    <circle cx="281" cy="112" r="15" fill="#e8efe0"/><text x="281" y="117" text-anchor="middle" fill="#294a36" font-size="14" font-weight="700">2</text>
    <text x="271" y="154" fill="#20382b" font-size="17" font-weight="700">TRANSCRIPT</text>
    <text x="271" y="183" fill="#607166" font-size="13">Words you can read</text>
    <path d="M271 204h145" stroke="#e0e7dc"/>
    <text x="271" y="236" fill="#42664b" font-size="12" font-weight="700">Copy · TXT</text>
    <text x="271" y="260" fill="#738078" font-size="11">No cue times in TXT</text>

    <circle cx="500" cy="112" r="15" fill="#e8efe0"/><text x="500" y="117" text-anchor="middle" fill="#294a36" font-size="14" font-weight="700">3</text>
    <text x="490" y="154" fill="#20382b" font-size="17" font-weight="700">SUBTITLE FILE</text>
    <text x="490" y="183" fill="#607166" font-size="13">Timed spoken lines</text>
    <path d="M490 204h145" stroke="#e0e7dc"/>
    <text x="490" y="236" fill="#42664b" font-size="12" font-weight="700">SRT · VTT</text>
    <text x="490" y="260" fill="#738078" font-size="11">Import into an editor</text>

    <circle cx="719" cy="112" r="15" fill="#e8efe0"/><text x="719" y="117" text-anchor="middle" fill="#294a36" font-size="14" font-weight="700">4</text>
    <text x="709" y="154" fill="#20382b" font-size="15" font-weight="700">VIDEO CAPTIONS</text>
    <text x="709" y="183" fill="#607166" font-size="12">Words over the image</text>
    <path d="M709 204h137" stroke="#e0e7dc"/>
    <text x="709" y="236" fill="#42664b" font-size="12" font-weight="700">Edit · preview · export</text>
    <text x="709" y="260" fill="#738078" font-size="11">A separate video step</text>
  </g>
</svg>
